name: Build Maqassa APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Prepare web directory
        run: |
          mkdir -p www
          cp khaider.html www/index.html

      - name: Initialize Capacitor and Android project
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "Maqassa" "com.maqassa.app" --web-dir=www
          npx cap add android
          npx cap copy android

      - name: Set Arabic App Name
        run: |
          sed -i 's/<string name="app_name">Maqassa<\/string>/<string name="app_name">مقاصة<\/string>/' android/app/src/main/res/values/strings.xml

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maqassa-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
